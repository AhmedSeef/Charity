<div dir="rtl" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0;" class="app-container">
  
  <!-- Sidebar -->
  <nav class="sidebar" *ngIf="auth.isLoggedIn()">
    <div class="sidebar-header">
      <img *ngIf="logo()" [src]="logo()" alt="شعار الجمعية">
      <div *ngIf="!logo()" style="height: 80px; width: 80px; border-radius: 50%; background-color: rgba(255,255,255,0.2); margin-bottom: 15px; display:flex; align-items:center; justify-content:center; font-size: 30px;">🏢</div>
      <h2 style="margin: 0; font-size: 20px; line-height: 1.4;">{{ title() }}</h2>
    </div>

    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active-link">📊 لوحة التحكم</a>
      <a routerLink="/beneficiaries" routerLinkActive="active-link">👨‍👩‍👧‍👦 إدارة المستفيدين</a>
      <a routerLink="/donations" routerLinkActive="active-link">💰 إدارة التبرعات</a>
      <a routerLink="/inventory" routerLinkActive="active-link">📦 الأصناف والمخازن</a>
      <a routerLink="/distributions" routerLinkActive="active-link">🔄 حركات الصرف</a>
      <a routerLink="/staff" routerLinkActive="active-link">👥 فريق العمل والمتطوعين</a>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; margin: 10px 0;">
      <a routerLink="/settings" routerLinkActive="active-link">⚙️ إعدادات الجمعية</a>
      
      <div style="flex-grow: 1;"></div>
      <button (click)="auth.logout()" style="background-color: #d32f2f; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 16px; margin-top: 20px;">🚪 تسجيل الخروج</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" [ngStyle]="{'padding': auth.isLoggedIn() ? '30px' : '0'}">
    <router-outlet></router-outlet>
  </main>

</div>
