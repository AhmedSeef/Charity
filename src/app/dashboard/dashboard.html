<div style="padding: 20px; text-align: right;" dir="rtl">
  <h2 style="color: #004d40; border-bottom: 2px solid #004d40; padding-bottom: 10px;">إحصائيات النظام السريعة</h2>
  <div style="display: flex; gap: 20px; text-align: center; margin-top: 20px;">
    
    <div style="flex: 1; padding: 20px; background-color: #e0f2f1; border: 1px solid #b2dfdb; border-radius: 8px;">
      <h3 style="margin: 0; color: #00695c;">المستفيدين المسجلين</h3>
      <p style="font-size: 32px; font-weight: bold; color: #004d40; margin: 15px 0 0 0;">{{ beneficiariesCount }}</p>
    </div>
    
    <div style="flex: 1; padding: 20px; background-color: #fff3e0; border: 1px solid #ffe0b2; border-radius: 8px;">
      <h3 style="margin: 0; color: #e65100;">حركات التبرعات</h3>
      <p style="font-size: 32px; font-weight: bold; color: #e65100; margin: 15px 0 0 0;">{{ donationsCount }}</p>
    </div>
    
    <div style="flex: 1; padding: 20px; background-color: #e8eaf6; border: 1px solid #c5cae9; border-radius: 8px;">
      <h3 style="margin: 0; color: #283593;">أصناف المخزن</h3>
      <p style="font-size: 32px; font-weight: bold; color: #283593; margin: 15px 0 0 0;">{{ inventoryCount }}</p>
    </div>

  </div>
</div>
