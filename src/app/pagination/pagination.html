<div class="pagination-container" *ngIf="totalItems > 0" dir="rtl">
  <!-- معلومات السجلات -->
  <div class="pagination-info">
    <span>عرض <strong>{{ startItem }}</strong> إلى <strong>{{ endItem }}</strong> من إجمالي <strong>{{ totalItems }}</strong> سجل</span>
  </div>

  <!-- أزرار التنقل بين الصفحات -->
  <div class="pagination-controls">
    <button type="button" class="page-btn nav-btn" 
            [disabled]="currentPage === 1" 
            (click)="goToPage(1)" 
            title="الصفحة الأولى">
      «
    </button>

    <button type="button" class="page-btn nav-btn" 
            [disabled]="currentPage === 1" 
            (click)="goToPage(currentPage - 1)" 
            title="الصفحة السابقة">
      ‹ السابق
    </button>

    <button type="button" class="page-btn number-btn" 
            *ngFor="let p of pages" 
            [class.active]="p === currentPage" 
            (click)="goToPage(p)">
      {{ p }}
    </button>

    <button type="button" class="page-btn nav-btn" 
            [disabled]="currentPage === totalPages" 
            (click)="goToPage(currentPage + 1)" 
            title="الصفحة التالية">
      التالي ›
    </button>

    <button type="button" class="page-btn nav-btn" 
            [disabled]="currentPage === totalPages" 
            (click)="goToPage(totalPages)" 
            title="الصفحة الأخيرة">
      »
    </button>
  </div>

  <!-- اختيار عدد العناصر بالصفحة -->
  <div class="pagination-size">
    <label for="pageSizeSelect">صفوف بالصفحة:</label>
    <select id="pageSizeSelect" [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)">
      <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>
    </select>
  </div>
</div>
