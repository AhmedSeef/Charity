<div dir="rtl" style="text-align: right;">
  <h2>إدارة المخازن</h2>

  <div style="background-color: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
    <h3>إضافة صنف جديد للمخزون</h3>
    <form (ngSubmit)="onSubmit()" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <input type="text" [(ngModel)]="newItem.itemName" name="itemName" placeholder="اسم الصنف" required style="padding: 8px;">
      
      <input type="number" [(ngModel)]="newItem.quantity" name="quantity" placeholder="الكمية" required style="padding: 8px; width: 100px;">
      
      <select [(ngModel)]="newItem.unit" name="unit" style="padding: 8px;">
        <option *ngFor="let u of units" [value]="u">{{ u }}</option>
      </select>

      <select [(ngModel)]="newItem.type" name="type" style="padding: 8px;">
        <option *ngFor="let t of types" [value]="t">{{ t }}</option>
      </select>

      <button type="submit" style="padding: 8px 15px; background-color: #004d40; color: white; border: none; cursor: pointer;">إضافة للمخزن</button>
    </form>
  </div>

  <div style="overflow-x: auto; width: 100%; border-radius: 8px;"><table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse;">
    <tr style="background-color: #e0f2f1; color: #004d40;">
      <th>اسم الصنف</th>
      <th>الكمية المتوفرة</th>
      <th>الوحدة</th>
      <th>النوع</th>
    </tr>
    <tr *ngFor="let item of inventory">
      <td>{{ item.itemName }}</td>
      <td><strong style="font-size: 16px;">{{ item.quantity }}</strong></td>
      <td>{{ item.unit }}</td>
      <td>{{ item.type }}</td>
    </tr>
  </table></div>
</div>
